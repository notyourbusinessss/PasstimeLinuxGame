name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pygame
      - run: python space_miner.py --version
      - name: Self-test (headless)
        run: python space_miner.py --selftest
      - name: Self-test with every developer cheat
        run: python space_miner.py --selftest --dev
      - name: Random-input stress test
        run: python tools/fuzz.py frames=500 states=fresh,mid

  macos:
    # The game on a Mac (Apple Silicon): the same checks, plus that the packaging script is valid shell.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame
      - run: python space_miner.py --version
      - name: Self-test (headless)
        run: python space_miner.py --selftest
      - name: Self-test with every developer cheat
        run: python space_miner.py --selftest --dev
      - name: Random-input stress test
        run: python tools/fuzz.py frames=300 states=fresh,mid
      - run: sh -n packaging/build_macos.sh

  web:
    # The web version (Safari on an iPhone, or any browser): build it with pygbag, then play it in a headless browser that looks like a phone held
    # sideways - it must start, draw, take taps and keep its save across a reload. It needs pygbag's CDN, so it can fail when that is down.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]          # webkit is the engine of Safari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web version
        shell: bash
        run: ./packaging/build_web.sh 2>&1 | tee build-web.log
      - run: pip install playwright && python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Play it in a phone-shaped browser
        shell: bash
        run: python tools/web_check.py build/web --out web-check-out --timeout 150 --browser ${{ matrix.browser }} 2>&1 | tee web-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check-${{ matrix.browser }}
          path: |
            web-check-out
            build-web.log
            web-check.log
