name: Release

# Push a tag like v1.0.0 to build the release and publish it on the Releases page.
# Or run it by hand (Actions -> Release -> Run workflow): it builds the files and keeps them as artifacts, and with
# "publish" ticked it also creates the release v<version> (the tag is made for you) from the chosen branch or commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        default: main
      publish:
        description: "Publish a GitHub release (tag v<version> from version.py)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04          # an older glibc, so the executable runs on most distros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame
      - name: Self-test (headless)
        run: python space_miner.py --selftest
      - name: Build the Linux release
        run: ./packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    # Builds Space Miner.app inside a .dmg for Apple Silicon and for Intel Macs, each on a Mac of its own kind (pygame ships a
    # separate wheel for each). Like the APK, a failure here does not stop the rest of the release.
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame
      - name: Self-test (headless)
        run: python space_miner.py --selftest
      - name: Build the macOS release
        run: ./packaging/build_macos.sh
      - name: Try the built app (headless)
        run: |
          APP="build/bin/Space Miner.app"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          "$APP/Contents/MacOS/Space Miner" --version
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$APP/Contents/MacOS/Space Miner" --selftest
          ls -la "$HOME/Library/Logs/Space Miner" || true
          file "$APP/Contents/MacOS/Space Miner"
      - name: Check the disk image
        run: |
          hdiutil attach dist/*.dmg -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/Space Miner.app"
          plutil -p "$RUNNER_TEMP/dmg/Space Miner.app/Contents/Info.plist"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  web:
    # The web version (it runs in Safari on an iPhone): a zip of static files, built with pygbag. A failure here does not stop the rest of the release.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web version
        run: ./packaging/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  android:
    # Builds the APK with buildozer / python-for-android (about 30-40 minutes the first time). If it fails the Linux release is
    # still published; the log of the failed build is kept as an artifact.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - run: pip install --upgrade pip "buildozer==1.5.0" "Cython==0.29.36" virtualenv
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build the APK
        run: buildozer -v android debug 2>&1 | tee android-build.log
      - name: Name the APK
        run: |
          VERSION=$(python3 -c "from version import __version__; print(__version__)")
          mkdir -p dist
          cp bin/*.apk "dist/space-miner-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-log
          path: android-build.log

  publish:
    needs: [linux, android, macos, web]
    if: always() && needs.linux.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,android,macos-arm64,macos-x86_64,web}"
          merge-multiple: true
      - name: Version (and, for a tag, check that it matches version.py)
        run: |
          VERSION=$(python3 -c "from version import __version__; print(__version__)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.py ($VERSION)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Space Miner $VERSION" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --title "Space Miner $VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)"
