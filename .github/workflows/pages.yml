name: Pages

# Publishes the web version of the game (what runs in Safari on an iPhone) at https://<owner>.github.io/<repo>/ - from the code of the latest
# release, or of the branch you pick when you run it by hand (Actions -> Pages -> Run workflow).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to publish"
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web version
        run: ./packaging/build_web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
